# Manual: Actions → "Slim OpenCV.js" → Run workflow (on the working branch).
# Commits the built vendor/opencv/opencv.js to that branch, and also keeps
# it as the "opencv-slim" artifact.
name: Slim OpenCV.js
on:
  workflow_dispatch:
    inputs:
      simd:
        description: Build with WebAssembly SIMD
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - run: SIMD=${{ inputs.simd && '1' || '0' }} scripts/opencv/build.sh "$RUNNER_TEMP/ocv"
      - uses: actions/upload-artifact@v4
        with:
          name: opencv-slim
          path: vendor/opencv/opencv.js
      - name: Commit to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/opencv/opencv.js
          git diff --cached --quiet && exit 0
          git commit -m "Slim OpenCV.js build (simd=${{ inputs.simd }}, run ${{ github.run_id }})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
